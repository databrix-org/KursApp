name: databrix
x-backend: &backend
  image: databrix/backend:local
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  environment: &environment
    DATABASE_URL: ${DATABASE_URL:-postgres://databrix:local-database-password@postgres:5432/databrix}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:9000}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  init: true
  stop_grace_period: 45s
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: databrix
      POSTGRES_USER: databrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U databrix -d databrix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.6-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    <<: *backend
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *backend
    environment:
      <<: *environment
      TMPDIR: /var/tmp/databrix
    volumes: [worker_spool:/var/tmp/databrix]
    command:
      [
        celery,
        -A,
        config,
        worker,
        --loglevel=INFO,
        --concurrency=2,
        --hostname=databrix@%h,
      ]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "celery -A config inspect ping --destination databrix@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
  dispatcher:
    <<: *backend
    command: [python, manage.py, run_dispatcher]
    healthcheck:
      test: [CMD, python, manage.py, check, --database, default]
      interval: 30s
      timeout: 10s
  web:
    image: databrix/web:local
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      web: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz/]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [local]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-local-databrix}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-local-storage-password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [object_data:/data]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  object_data:
  worker_spool:
