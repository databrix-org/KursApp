components:
  schemas:
    AdminAnnouncementRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          minLength: 1
          maxLength: 100000
        recipients:
          $ref: '#/components/schemas/RecipientsEnum'
        selected_users:
          type: array
          items:
            type: integer
      required:
      - body
      - recipients
      - subject
    AnnouncementRequestRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          minLength: 1
          maxLength: 100000
      required:
      - body
      - subject
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/AssetCategoryEnum'
        course:
          type: integer
          nullable: true
        lesson:
          type: integer
          nullable: true
        ticket:
          type: integer
          nullable: true
        submission:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 255
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sha256:
          type: string
          maxLength: 64
        content_type:
          type: string
          maxLength: 128
        status:
          type: string
          maxLength: 16
      required:
      - category
      - id
      - name
    AssetCategoryEnum:
      enum:
      - course
      - notebooks
      - assessment
      - support
      type: string
      description: |-
        * `course` - course
        * `notebooks` - notebooks
        * `assessment` - assessment
        * `support` - support
    AssetInitiationCategoryEnum:
      enum:
      - course
      - assessment
      - support
      type: string
      description: |-
        * `course` - course
        * `assessment` - assessment
        * `support` - support
    AssetInitiationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          maximum: 2147483648
          minimum: 1
          format: int64
        category:
          $ref: '#/components/schemas/AssetInitiationCategoryEnum'
        course:
          type: integer
          nullable: true
        lesson:
          type: integer
          nullable: true
        ticket:
          type: integer
          nullable: true
      required:
      - category
      - name
      - size
    AssetUpload:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        url:
          type: string
          format: uri
        content_type:
          type: string
      required:
      - asset
      - content_type
      - url
    Capabilities:
      type: object
      properties:
        teach:
          type: boolean
        manage:
          type: boolean
      required:
      - manage
      - teach
    Completion:
      type: object
      properties:
        completed:
          type: boolean
      required:
      - completed
    CompletionRequest:
      type: object
      properties:
        completed:
          type: boolean
      required:
      - completed
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        instructor:
          type: integer
          readOnly: true
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
          description: Course start date
        end_date:
          type: string
          format: date
          nullable: true
          description: Course end date
        difficulty_level:
          allOf:
          - $ref: '#/components/schemas/DifficultyLevelEnum'
          description: |-
            Course difficulty level

            * `1` - Beginner
            * `2` - Intermediate
            * `3` - Advanced
            * `4` - Professional
            * `5` - Demo
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        max_members:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Maximum number of students allowed in a group (for group exercises)
        is_published:
          type: boolean
        frontend_enabled:
          type: boolean
        lab_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        capabilities:
          allOf:
          - $ref: '#/components/schemas/Capabilities'
          readOnly: true
        enrolled:
          type: boolean
          readOnly: true
      required:
      - capabilities
      - enrolled
      - id
      - instructor
    CourseRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
          nullable: true
          description: Course start date
        end_date:
          type: string
          format: date
          nullable: true
          description: Course end date
        difficulty_level:
          allOf:
          - $ref: '#/components/schemas/DifficultyLevelEnum'
          description: |-
            Course difficulty level

            * `1` - Beginner
            * `2` - Intermediate
            * `3` - Advanced
            * `4` - Professional
            * `5` - Demo
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        max_members:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Maximum number of students allowed in a group (for group exercises)
        is_published:
          type: boolean
        frontend_enabled:
          type: boolean
        lab_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        enrollment_key:
          type: string
          writeOnly: true
          maxLength: 100
    CourseStudent:
      type: object
      properties:
        student_id:
          type: integer
        student__first_name:
          type: string
        student__last_name:
          type: string
        student__email:
          type: string
          format: email
        notebook_access__confirmed:
          type: boolean
          nullable: true
      required:
      - notebook_access__confirmed
      - student__email
      - student__first_name
      - student__last_name
      - student_id
    DifficultyLevelEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      type: integer
      description: |-
        * `1` - Beginner
        * `2` - Intermediate
        * `3` - Advanced
        * `4` - Professional
        * `5` - Demo
    Download:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
      - url
    EnrollmentRequestRequest:
      type: object
      properties:
        key:
          type: string
    Exercise:
      type: object
