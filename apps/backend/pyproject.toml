[project]
name = "databrix-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<4", "drf-spectacular>=0.28,<1",
  "django-allauth[headless]>=65.13,<66", "psycopg[binary]>=3.2,<4", "Pillow>=11,<13",
  "boto3>=1.40,<2", "nbformat>=5.10,<6", "bleach>=6.2,<7", "celery[redis]>=5.5,<6",
  "whitenoise>=6.11,<7",
  "gunicorn>=23,<27", "django-environ>=0.12,<1",
  "django-shibboleth-remoteuser @ git+https://github.com/Brown-University-Library/django-shibboleth-remoteuser.git@962f6f9818683ef5f6432f091d22945e54b82592"
]
[dependency-groups]
dev = ["moto[s3,server]>=5.1,<6", "ruff>=0.14,<1"]
[tool.uv]
package = false
