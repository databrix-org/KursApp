pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=1s ipv6=off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 4m;
    set $backend_upstream http://backend:8000;
    set $web_upstream http://web:3000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # The TLS ingress must strip client-supplied forwarded/identity headers.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Databrix-Sso-Secret "";
    proxy_set_header X-Databrix-Sso-Issuer "";
    proxy_set_header X-Databrix-Sso-Subject "";
    proxy_set_header X-Databrix-Sso-Email "";
    proxy_set_header X-Databrix-Sso-First-Name "";
    proxy_set_header X-Databrix-Sso-Last-Name "";
    proxy_set_header Remote-User "";
    proxy_read_timeout 95s;
    location ~ ^/(api|auth|course|data|admin|static)/ { proxy_pass $backend_upstream; proxy_no_cache 1; proxy_cache_bypass 1; }
    location ~ ^/(healthz|readyz)/ { proxy_pass $backend_upstream; }
    location / { proxy_pass $web_upstream; }
  }
}
